{{ if .Values.iam.keycloak.enabled -}}
{{ if .Values.iam.keycloak.postgres.enabled -}}
{{ if not .Values.iam.keycloak.postgres.secretRef -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
{{- if and (not .Values.iam.keycloak.postgres.password) .Values.iam.keycloak.configuration.useSecretGenerator }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
{{- end }}
data:
  username: {{ .Values.iam.keycloak.postgres.username | default "keycloak" | b64enc | quote }}
{{- if or .Values.iam.keycloak.postgres.password (not .Values.iam.keycloak.configuration.useSecretGenerator) }}
  password: {{ .Values.iam.keycloak.postgres.password | default "INSECURE!dummy_PASSWORD" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}