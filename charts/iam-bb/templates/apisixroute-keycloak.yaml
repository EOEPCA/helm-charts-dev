{{ if .Values.keycloak.enabled -}}
{{ if .Values.iam.keycloak.createRoute -}}
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: keycloak-route
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.iam.apisix.ingressClassName }}
  http:
  - backends:
    - serviceName: {{ printf "%s-keycloak" .Release.Name }} #iam-keycloak
{{- if .Values.keycloak.tls.enabled }}
      servicePort: 443
{{- else }}
      servicePort: 80
{{- end }}
    match:
      hosts: {{- .Values.iam.keycloak.hosts | toYaml | nindent 6 }}
      paths: {{- .Values.iam.keycloak.paths | toYaml | nindent 6 }}
    name: keycloak
{{- if .Values.keycloak.cors.enabled }}
    plugins:
      # Allow CORS access
      - name: cors
        enable: true
        config:
          {{- $allowOrigins := .Values.keycloak.cors.allowedOrigins -}}
          {{- if kindIs "slice" $allowOrigins -}}
             {{- $allowOrigins = join "," $allowOrigins -}}
          {{- end }}
          allow_origins: {{ $allowOrigins | quote }}
          allow_methods: {{ .Values.keycloak.cors.allowedMethods | quote }}
          allow_headers: {{ .Values.keycloak.cors.allowedHeaders | quote }}
          expose_headers: {{ .Values.keycloak.cors.exposedHeaders | quote }}
          allow_credential: {{ .Values.keycloak.cors.allowCredentials }}
          max_age: {{ .Values.keycloak.cors.maxAge }}
{{- end }}
# The following workaround has been replaced with a global rule and is not needed here any more.
#    plugins:
#      # Possible workaround for redirect-to-9443 problem that also works for HTTP
#      - name: serverless-pre-function
#        enable: true
#        config:
#          phase: "rewrite"
#          functions:
#            - "return function(conf, ctx) if tonumber(ngx.var.var_x_forwarded_port) > 9000 then ngx.var.var_x_forwarded_port = ngx.var.var_x_forwarded_port - 9000 end end"
{{ end -}}
{{ end -}}
